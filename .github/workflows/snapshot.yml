name: Roblox Snapshots

on:
  schedule:
    - cron: "0 * * * *"   # every hour (UTC)
  workflow_dispatch: {}

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/snapshot.py

      - name: Quick DB check
        run: |
          python - <<'PY'
          import sqlite3, os
          db = "data/snapshots.sqlite"
          assert os.path.exists(db), f"DB not found: {db}"
          con = sqlite3.connect(db)
          cur = con.cursor()
          cur.execute("SELECT COUNT(*) FROM snapshots;")
          n = cur.fetchone()[0]
          print("rows:", n)
          cur.execute("SELECT ts_utc, game_id, current_players, visits, favorites, title FROM snapshots ORDER BY id DESC LIMIT 5;")
          for r in cur.fetchall():
            print(r)
          con.close()
          assert n > 0, "No rows inserted"
          PY

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-sqlite
          path: data/snapshots.sqlite